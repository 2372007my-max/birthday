<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيد ميلاد محمد 🎂</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:Segoe UI, sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
  overflow-x:hidden;
  position:relative;
}

/* النجوم */
#stars{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:0;
  background:black;
}

/* شاشة تحميل */
#loader{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:#0f172a;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.spinner{
  width:50px;
  height:50px;
  border:5px solid #333;
  border-top:5px solid #ff4d6d;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* الصفحات */
.page{display:none;min-height:100vh;padding:5vh 5vw;position:relative;z-index:1;}
.active{display:block;}
.card{
  background:rgba(255,255,255,.08);
  padding:25px;
  border-radius:20px;
  max-width:400px;
  margin:auto;
}
button{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:#ff4d6d;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:15px;
}
input{
  padding:10px;
  width:80%;
  border-radius:8px;
  border:none;
}

/* اسم متحرك */
.name{
  font-size:6vw;
  font-weight:bold;
  background:linear-gradient(90deg,#ff4d6d,#ffd166,#06d6a0,#4cc9f0);
  background-size:300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 4s linear infinite;
}
@keyframes shine{0%{background-position:0%;}100%{background-position:300%;}}

/* العد التنازلي */
.countdown{
  font-size:5vw;
  margin-top:2vh;
}

/* typing */
.typing{
  border-right:3px solid white;
  white-space:nowrap;
  overflow:hidden;
  display:inline-block;
  font-size:4vw;
  margin-top:2vh;
}

/* بلالين */
.balloon{
  position:fixed;
  bottom:-100px;
  width:10vw;
  max-width:60px;
  height:14vw;
  max-height:80px;
  border-radius:50%;
  animation:float 8s linear infinite;
  cursor:pointer;
  z-index:2;
}
@keyframes float{to{transform:translateY(-120vh);}}

/* معرض ذكريات */
.memory-box{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5vw;
  margin-top:4vh;
  flex-wrap:wrap;
}
.memory-box img{
  width:40vw;
  max-width:220px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
  transition:.6s;
  opacity:1;
}
.memory-box img.fade-out{opacity:0;}
.memory-box button{
  font-size:5vw;
  padding:1vw 2vw;
}

/* الألعاب النارية */
#fireworks{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:1;
}

/* زر تشغيل/إيقاف موسيقى */
.musicBtn{
  margin-top:3vh;
  font-size:4vw;
  padding:1vw 3vw;
}
</style>
</head>

<body>

<!-- النجوم -->
<canvas id="stars"></canvas>

<!-- شاشة تحميل -->
<div id="loader">
  <div class="spinner"></div>
  <p style="font-size:4vw;">جارِ تحضير المفاجأة لمحمد 🎁</p>
</div>

<!-- صفحة الباسورد -->
<div id="login" class="page active">
  <div class="card">
    <h2>🎁 مفاجأة</h2>
    <input type="password" id="pass">
    <br>
    <button onclick="check()">دخول</button>
    <p id="error"></p>
  </div>
</div>

<!-- صفحة الترحيب -->
<div id="welcome" class="page">
  <div class="name">محمد</div>
  <h2 style="font-size:5vw;">عيد ميلاد سعيد 🎂</h2>
  <div class="countdown" id="countdown"></div>
  <p style="margin-top:3vh;font-size:4vw;">اضغط علشان تفتح المفاجأة</p>
  <button onclick="openGift()">فتح الهدية</button>
</div>

<!-- صفحة المفاجأة -->
<div id="gift" class="page">
  <h1 style="font-size:6vw;">🎉 كل سنة وانت طيب يا محمد 🎉</h1>
  <div class="typing" id="typing"></div>
  <br>
  <button onclick="celebrate()">احتفال 🎈</button>
  <br>

  <h2 style="font-size:5vw;margin-top:4vh;">📸 ذكريات محمد</h2>
  <div class="memory-box">
    <button onclick="prev()">⬅</button>
    <img id="memoryImg" src="m1.jpg">
    <button onclick="next()">➡</button>
  </div>

  <button class="musicBtn" onclick="toggleMusic()">تشغيل/إيقاف الموسيقى 🎵</button>

  <audio id="flipSound" src="flip.mp3" preload="auto"></audio>
  <audio id="birthdayMusic" src="happy_birthday.mp3" preload="auto"></audio>
  <audio id="balloonSound" src="balloon.mp3" preload="auto"></audio>
  <canvas id="fireworks"></canvas>
</div>

<script>
const password="22/2/2007";

/* شاشة تحميل */
window.onload=function(){
  setTimeout(()=>{document.getElementById("loader").style.display="none";},2000);
  initStars();
  createBalloons();
}

/* تسجيل الدخول */
function check(){
  if(document.getElementById("pass").value===password){
    switchPage("login","welcome");
    startCountdown();
  }else{
    document.getElementById("error").innerText="الباسورد غلط";
  }
}

function openGift(){
  switchPage("welcome","gift");
  typeMessage();
  startSlideshow();
  const music=document.getElementById("birthdayMusic");
  music.currentTime=0;
  music.play();
}

function toggleMusic(){
  const music=document.getElementById("birthdayMusic");
  if(music.paused) music.play(); else music.pause();
}

function switchPage(from,to){
  document.getElementById(from).classList.remove("active");
  document.getElementById(to).classList.add("active");
}

/* العد التنازلي */
function startCountdown(){
  const birthday=new Date("Feb 22, 2026 00:00:00").getTime();
  setInterval(()=>{
    let now=new Date().getTime();
    let diff=birthday-now;
    let d=Math.floor(diff/(1000*60*60*24));
    let h=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    let m=Math.floor((diff%(1000*60*60))/(1000*60));
    document.getElementById("countdown").innerHTML=
    "⏳ باقي "+d+" يوم "+h+" ساعة "+m+" دقيقة";
  },1000);
}

/* typing effect */
function typeMessage(){
  const text="يا محمد، انت صاحب جدع بجد — ربنا يخليك دايماً مبسوط وناجح 🎉";
  let i=0;
  let speed=50;
  function typing(){
    if(i<text.length){
      document.getElementById("typing").innerHTML+=text.charAt(i);
      i++;
      setTimeout(typing,speed);
    }
  }
  typing();
}

/* احتفال بلالين */
function celebrate(){
  for(let i=0;i<25;i++){
    let b=document.createElement("div");
    b.className="balloon";
    b.style.left=Math.random()*100+"%";
    b.style.background=`hsl(${Math.random()*360},70%,60%)`;
    b.style.animationDuration=(5+Math.random()*5)+"s";
    b.onclick = ()=>{document.getElementById("balloonSound").play(); b.remove();};
    document.body.appendChild(b);
  }
}

/* ألبوم ذكريات */
const images=["m1.jpg","m2.jpg","m3.jpg"];
let index=0;
let slideInterval;

function changeImage(newIndex){
  const img=document.getElementById("memoryImg");
  const sound=document.getElementById("flipSound");
  img.classList.add("fade-out");
  setTimeout(()=>{
    index=newIndex;
    img.src=images[index];
    img.classList.remove("fade-out");
    sound.currentTime=0;
    sound.play();
    firework();
  },300);
}
function next(){changeImage((index+1)%images.length);}
function prev(){changeImage((index-1+images.length)%images.length);}
function startSlideshow(){
  slideInterval=setInterval(()=>{next();},3000);
}

/* الألعاب النارية */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
function firework(){
  let x=Math.random()*canvas.width;
  let y=Math.random()*canvas.height/2;
  for(let i=0;i<40;i++){
    let angle=Math.random()*Math.PI*2;
    let speed=Math.random()*4;
    let px=x; let py=y;
    let dx=Math.cos(angle)*speed;
    let dy=Math.sin(angle)*speed;
    let life=30;
    (function animate(){
      if(life<=0) return;
      ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;
      ctx.fillRect(px,py,3,3);
      px+=dx; py+=dy;
      life--;
      requestAnimationFrame(animate);
    })();
  }
}

/* النجوم */
const starsCanvas=document.getElementById("stars");
const sCtx=starsCanvas.getContext("2d");
starsCanvas.width=window.innerWidth;
starsCanvas.height=window.innerHeight;
const stars=[];
for(let i=0;i<100;i++){
  stars.push({x:Math.random()*starsCanvas.width, y:Math.random()*starsCanvas.height, r:Math.random()*1.5+0.5, dx:(Math.random()-0.5)/2, dy:(Math.random()-0.5)/2});
}
function initStars(){
  function drawStars(){
    sCtx.clearRect(0,0,starsCanvas.width,starsCanvas.height);
    stars.forEach(st=>{
      sCtx.fillStyle="white";
      sCtx.beginPath();
      sCtx.arc(st.x,st.y,st.r,0,Math.PI*2);
      sCtx.fill();
      st.x+=st.dx; st.y+=st.dy;
      if(st.x<0) st.x=starsCanvas.width;
      if(st.x>starsCanvas.width) st.x=0;
      if(st.y<0) st.y=starsCanvas.height;
      if(st.y>starsCanvas.height) st.y=0;
    });
    requestAnimationFrame(drawStars);
  }
  drawStars();
}

/* بلالين مستمرة + صوت عند الضغط */
function createBalloons(){
  setInterval(()=>{
    let b=document.createElement("div");
    b.className="balloon";
    b.style.left=Math.random()*90+"%";
    b.style.background=`hsl(${Math.random()*360},70%,60%)`;
    b.style.animationDuration=(5+Math.random()*5)+"s";
    b.onclick=()=>{document.getElementById("balloonSound").play(); b.remove();};
    document.body.appendChild(b);
    setTimeout(()=>{if(b.parentNode)b.remove();},10000);
  },1500);
}

/* إعادة ضبط canvas عند تغيير حجم الشاشة */
window.addEventListener('resize',()=>{
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  starsCanvas.width=window.innerWidth;
  starsCanvas.height=window.innerHeight;
});
</script>

</body>
</html>
